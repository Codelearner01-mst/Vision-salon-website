{% extends "base.html" %} {% block content %}

<div class="page-header text-center reveal">
  <div class="container">
    <span class="story-badge">Our Team</span>
    <h1 class="page-title">Meet our stylists</h1>
    <p class="page-description">
      A talented team of professionals passionate about bringing out your best
      look.
    </p>
  </div>
</div>

<main class="pb-5">
  <div class="container">
    <div class="team-list">
      {% for member in team %}
      <div class="team-card">
        <div class="team-img-wrapper">
          <img
            src="{{ member.image }}"
            alt="{{ member.name }}"
            class="team-img"
          />
        </div>
        <div class="team-content">
          <h4 class="title font-serif mb-1">{{ member.name }}</h4>
          <span class="role text-pink small d-block mb-3"
            >{{ member.role }}</span
          >
          <p class="bio text-muted small mb-4">
            {{ member.bio | truncate(110) }}
          </p>
          <div class="team-socials">
            <a
              href="#"
              class="social-icon"
              target="_blank"
              rel="noreferrer noopener"
              ><i class="fab fa-instagram"></i
            ></a>
            <a
              href="#"
              class="social-icon"
              target="_blank"
              rel="noreferrer noopener"
              ><i class="fab fa-facebook-f"></i
            ></a>
            <a
              href="#"
              class="social-icon"
              target="_blank"
              rel="noreferrer noopener"
              ><i class="fab fa-linkedin-in"></i
            ></a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</main>

{% endblock %}
